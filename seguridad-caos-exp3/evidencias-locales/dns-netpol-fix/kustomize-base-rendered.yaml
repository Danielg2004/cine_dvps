    metadata:
      labels:
        app: cine-exp3-emitter
        app.kubernetes.io/part-of: cine-seguridad-exp3
        cine.security.chaos/lab: cine-seguridad-exp3
        cine.security.chaos/role: telemetry-emitter
        instance: emitter-a
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - /lab/emitter.mjs
        env:
        - name: HEALTH_PORT
          value: "8080"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: INSTANCE_LABEL
          value: emitter-a
        - name: CONTAINMENT_ACTIVE
          valueFrom:
            configMapKeyRef:
              key: CONTAINMENT_ACTIVE
              name: cine-exp3-containment
        envFrom:
        - configMapRef:
            name: cine-exp3-lab-config
        image: node:22-bookworm-slim
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 15
        name: emitter
        ports:
        - containerPort: 8080
          name: health
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
        volumeMounts:
        - mountPath: /lab
          name: emitter-script
          readOnly: true
        - mountPath: /containment
          name: containment
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: cine-exp3-emitter
      volumes:
      - configMap:
          defaultMode: 292
          name: cine-exp3-emitter-script
        name: emitter-script
      - configMap:
          defaultMode: 292
          name: cine-exp3-containment
        name: containment
      - emptyDir:
          sizeLimit: 16Mi
        name: tmp
