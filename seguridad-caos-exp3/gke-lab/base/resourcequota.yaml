# Tope de costo Autopilot para el lab aislado.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cine-exp3-quota
  namespace: cine-seguridad-exp3
  labels:
    app.kubernetes.io/part-of: cine-seguridad-exp3
spec:
  hard:
    pods: "6"
    requests.cpu: "500m"
    requests.memory: "1Gi"
    limits.cpu: "1"
    limits.memory: "2Gi"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cine-exp3-limits
  namespace: cine-seguridad-exp3
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "50m"
        memory: "128Mi"
      default:
        cpu: "200m"
        memory: "256Mi"
      max:
        cpu: "500m"
        memory: "512Mi"
