            - name: HEALTH_PORT
              value: "8080"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INSTANCE_LABEL
              value: "emitter-b"
            # Inyección parcial SIN restart: lee flags desde volumen en cada tick
            - name: EMIT_FLAGS_DIR
              value: "/emit-flags"
            - name: CONTAINMENT_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: cine-exp3-containment
                  key: CONTAINMENT_ACTIVE
          volumeMounts:
            - name: emitter-script
              mountPath: /lab
              readOnly: true
            - name: containment
              mountPath: /containment
              readOnly: true
            - name: emit-flags
              mountPath: /emit-flags
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: emitter-script
          configMap:
            name: cine-exp3-emitter-script
            defaultMode: 0444
        - name: containment
          configMap:
            name: cine-exp3-containment
            defaultMode: 0444
        - name: emit-flags
          configMap:
            name: cine-exp3-emitter-b-flags
            defaultMode: 0444
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
