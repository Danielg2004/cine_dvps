# Base del laboratorio aislado cine-seguridad-exp3 — NO APLICAR sin autorización.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cine-seguridad-exp3
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - resourcequota.yaml
  - configmap-lab-config.yaml
  - configmap-emitter-script.yaml
  - configmap-receiver-script.yaml
  - configmap-emitter-b-flags.yaml
  - configmap-containment.yaml
  - deployment-otlp-receiver.yaml
  - deployment-telemetry-emitter.yaml
  - service-clusterip.yaml
  - networkpolicy.yaml
labels:
  - pairs:
      cine.security.chaos/lab: "cine-seguridad-exp3"
    includeSelectors: false
    includeTemplates: true
