services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "3307:3306"

    volumes:
      - cine_mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    build: .
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      DB_PORT: 3306
      APP_VERSION: ${APP_VERSION:-5.0.0}
      APP_TRACK: ${APP_TRACK:-caos}
      CACHE_URL: ${CACHE_URL:-}
      CHAOS_FAULT_TOKEN: ${CHAOS_FAULT_TOKEN:-}
      EXPERIMENT_ROUND: ${EXPERIMENT_ROUND:-baseline}
      ADMISSION_MAX_INFLIGHT: ${ADMISSION_MAX_INFLIGHT:-3}
      BULKHEAD_MAX_CONCURRENT: ${BULKHEAD_MAX_CONCURRENT:-2}
      OTEL_SERVICE_NAME: cine-api
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  cine_mysql_data: