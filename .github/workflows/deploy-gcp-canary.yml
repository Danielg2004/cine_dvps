name: Cine V4 - Deploy GCP Canary

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cine-gcp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar y desplegar Canary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PROJECT_ID: cine-devops-canary
      REGION: us-central1
      SERVICE: cine-api
      IMAGE_REPO: us-central1-docker.pkg.dev/cine-devops-canary/cine-canary/cine-api

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: cine-devops-canary
          workload_identity_provider: projects/523098010476/locations/global/workloadIdentityPools/cine-github-pool/providers/cine-github-provider
          service_account: cine-github-deploy-sa@cine-devops-canary.iam.gserviceaccount.com

      - name: Configurar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verificar identidad
        run: |
          gcloud auth list
          gcloud config set project "$PROJECT_ID"

      - name: Configurar Docker para Artifact Registry
        run: |
          gcloud auth configure-docker \
            us-central1-docker.pkg.dev --quiet

      - name: Construir imagen Canary
        run: |
          IMAGE="$IMAGE_REPO:canary-${GITHUB_SHA}"

          docker build \
            --platform linux/amd64 \
            --tag "$IMAGE" \
            .

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Publicar imagen
        run: |
          docker push "$IMAGE"

      - name: Desplegar Canary sin trafico
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE" \
            --service-account="cine-run-sa@cine-devops-canary.iam.gserviceaccount.com" \
            --no-traffic \
            --tag=canary \
            --quiet

      - name: Obtener token para Cloud Run privado
        id: auth_cloud_run
        uses: google-github-actions/auth@v3
        with:
          project_id: cine-devops-canary
          workload_identity_provider: projects/523098010476/locations/global/workloadIdentityPools/cine-github-pool/providers/cine-github-provider
          service_account: cine-github-deploy-sa@cine-devops-canary.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: https://cine-api-evr4elf76q-uc.a.run.app
          id_token_include_email: true

      - name: Validar endpoints Canary
        shell: bash
        env:
          CLOUD_RUN_ID_TOKEN: ${{ steps.auth_cloud_run.outputs.id_token }}
          CANARY_URL: https://canary---cine-api-evr4elf76q-uc.a.run.app
        run: |
          set -euo pipefail

          for ruta in /api/v2/health /peliculas; do
            echo "Verificando $ruta"

            status=$(curl --silent --show-error \
              --max-time 40 \
              --retry 2 \
              -D headers.txt \
              -o respuesta.json \
              -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUD_RUN_ID_TOKEN" \
              "$CANARY_URL$ruta")

            echo "HTTP: $status"

            if [ "$status" != "200" ]; then
              echo "::error::Canary fallo en $ruta con HTTP $status"
              exit 1
            fi

            if ! tr -d '\r' < headers.txt | grep -Eiq '^x-app-track:[[:space:]]*canary$'; then
              echo "::error::Track Canary incorrecto en $ruta"
              exit 1
            fi

            if ! tr -d '\r' < headers.txt | grep -Eiq '^x-app-version:[[:space:]]*4\.0\.0$'; then
              echo "::error::Version incorrecta en $ruta"
              exit 1
            fi

            echo "Prueba aprobada: $ruta"
          done

          echo "Canary V4 validado correctamente"
      - name: Quality Gate de errores y latencia
        shell: bash
        env:
          CLOUD_RUN_ID_TOKEN: ${{ steps.auth_cloud_run.outputs.id_token }}
        run: |
          python3 .github/scripts/quality-gate.py
      - name: Promocion automatica con Quality Gate
        id: promocion
        shell: bash
        env:
          CANARY_ROLLBACK_DRILL: "true"
          CLOUD_RUN_ID_TOKEN: ${{ steps.auth_cloud_run.outputs.id_token }}
        run: |
          python3 .github/scripts/promote-canary.py

      - name: Rollback de emergencia si falla la promocion
        if: ${{ failure() && steps.promocion.outcome == 'failure' }}
        shell: bash
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-tags="stable=100,canary=0" \
            --quiet
      - name: Verificar distribucion
        run: |
          gcloud run services describe "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format="yaml(status.traffic)"

      - name: Mostrar revisiones
        run: |
          gcloud run revisions list \
            --service="$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION"




