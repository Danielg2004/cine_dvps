name: Pipeline de Pruebas

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        run: npm test

      - name: Validar cobertura minima de pruebas
        run: npx vitest run --coverage --coverage.thresholds.statements=60 --coverage.thresholds.lines=60 --coverage.thresholds.functions=60