
name: Deploy Cine AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cine-aws-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar Cine API
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/cine-dvps-dev-cine-api:$IMAGE_TAG" \
            .
          docker push "$REGISTRY/cine-dvps-dev-cine-api:$IMAGE_TAG"

      - name: Construir y publicar Cache Service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/cine-dvps-dev-cache-service:$IMAGE_TAG" \
            ./cache-service
          docker push "$REGISTRY/cine-dvps-dev-cache-service:$IMAGE_TAG"

  deploy-ec2:
    name: Deploy Containers to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Descubrir instancia EC2 del proyecto
        id: discover-ec2
        run: |
          set -euo pipefail

          INSTANCE_IDS=$(aws ec2 describe-instances \
            --region us-east-2 \
            --filters \
              "Name=tag:Project,Values=cine-dvps" \
              "Name=tag:Environment,Values=dev" \
              "Name=tag:Name,Values=cine-dvps-dev-ec2" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | tr '\t' '\n' | sed '/^$/d')

          COUNT=$(printf '%s\n' "$INSTANCE_IDS" | sed '/^$/d' | wc -l | tr -d ' ')

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: no se encontro ninguna EC2 del proyecto"
            exit 1
          fi

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: se esperaba exactamente 1 EC2, se encontraron $COUNT"
            printf '%s\n' "$INSTANCE_IDS"
            exit 1
          fi

          INSTANCE_ID=$(printf '%s\n' "$INSTANCE_IDS" | head -n 1)

          echo "Instancia encontrada: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Esperar a que SSM este Online
        env:
          INSTANCE_ID: ${{ steps.discover-ec2.outputs.instance_id }}
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=36
          SLEEP_SECONDS=10

          echo "Esperando SSM Online en $INSTANCE_ID..."

          attempt=1

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            STATUS=$(aws ssm describe-instance-information \
              --region us-east-2 \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            if [ "$STATUS" = "Online" ]; then
              echo "SSM Online"
              exit 0
            fi

            echo "Intento ${attempt}/${MAX_ATTEMPTS}: Estado=${STATUS:-no-registrada}"

            sleep "$SLEEP_SECONDS"
            attempt=$((attempt + 1))
          done

          echo "ERROR: SSM no estuvo Online dentro del tiempo esperado"
          exit 1

      - name: Preparar comando de despliegue
        env:
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: ${{ steps.discover-ec2.outputs.instance_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          tag = os.environ["IMAGE_TAG"]
          instance_id = os.environ["INSTANCE_ID"]

          if not re.fullmatch(r"[0-9a-f]{40}", tag):
              raise ValueError("Etiqueta de imagen invalida")

          if not re.fullmatch(r"i-[0-9a-f]+", instance_id):
              raise ValueError("Instance ID invalido")

          registry = "102798328572.dkr.ecr.us-east-2.amazonaws.com"

          commands = [
              "set -eu",
              "cd /opt/cine-dvps",

              "test -f docker-compose.aws.yml",
              "test -f .env",

              # Actualizar las imagenes al commit actual.
              f"sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=\"{tag}\"/' .env",

              # CORRECCION: autenticar Docker en ECR antes del pull.
              (
                  "aws ecr get-login-password --region us-east-2 "
                  f"| docker login --username AWS --password-stdin {registry}"
              ),

              "echo 'Autenticacion ECR completada'",

              # Descargar e iniciar los contenedores.
              "docker compose --env-file .env -f docker-compose.aws.yml pull",

              "docker compose --env-file .env -f docker-compose.aws.yml up -d",

              # Verificar que la API responda.
              "echo 'Esperando a que Cine API este lista...'",

              (
                  "for i in $(seq 1 24); do "
                  "if curl --fail --silent --max-time 3 "
                  "-o /dev/null http://127.0.0.1:3000/peliculas; then "
                  "echo 'API LISTA'; exit 0; "
                  "fi; "
                  "echo 'Esperando API...'; "
                  "sleep 5; "
                  "done; "
                  "echo 'ERROR: API NO RESPONDE'; "
                  "exit 1"
              )
          ]

          request = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [instance_id],
              "Parameters": {
                  "commands": commands
              },
              "TimeoutSeconds": 600
          }

          with open("ssm-deploy.json", "w", encoding="utf-8") as file:
              json.dump(request, file)
          PY

      - name: Actualizar contenedores en EC2
        env:
          INSTANCE_ID: ${{ steps.discover-ec2.outputs.instance_id }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-deploy.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Instance ID: $INSTANCE_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then

            echo "Comando SSM finalizado correctamente"

          else

            echo "El comando SSM fallo"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Estado:Status,Resultado:StandardOutputContent,Errores:StandardErrorContent}' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Estado:Status,Resultado:StandardOutputContent,Errores:StandardErrorContent}' \
            --output json
