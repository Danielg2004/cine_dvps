
name: Deploy Cine AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cine-aws-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Iniciar sesion en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y publicar Cine API
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/cine-dvps-dev-cine-api:$IMAGE_TAG" \
            .
          docker push "$REGISTRY/cine-dvps-dev-cine-api:$IMAGE_TAG"

      - name: Construir y publicar Cache Service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/cine-dvps-dev-cache-service:$IMAGE_TAG" \
            ./cache-service
          docker push "$REGISTRY/cine-dvps-dev-cache-service:$IMAGE_TAG"

  deploy-ec2:
    name: Deploy Containers to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Preparar comando de despliegue
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          tag = os.environ["IMAGE_TAG"]

          if not re.fullmatch(r"[0-9a-f]{40}", tag):
              raise ValueError("Etiqueta de imagen invalida")

          commands = [
              "set -eu",
              "cd /opt/cine-dvps",
              f"sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=\"{tag}\"/' .env",
              "docker compose --env-file .env -f docker-compose.aws.yml pull",
              "docker compose --env-file .env -f docker-compose.aws.yml up -d",
              "curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-connrefused --max-time 15 -o /dev/null http://127.0.0.1:3000/peliculas",
              "echo 'DESPLIEGUE DE CINE EXITOSO'"
          ]

          request = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": ["i-0f92f7f92a870f940"],
              "Parameters": {
                  "commands": commands
              },
              "TimeoutSeconds": 600
          }

          with open("ssm-deploy.json", "w", encoding="utf-8") as file:
              json.dump(request, file)
          PY

      - name: Actualizar contenedores en EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file://ssm-deploy.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0f92f7f92a870f940

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0f92f7f92a870f940 \
            --query '{Estado:Status,Resultado:StandardOutputContent,Errores:StandardErrorContent}' \
            --output json
