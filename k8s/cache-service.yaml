apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-service
  template:
    metadata:
      labels:
        app: cache-service
    spec:
      containers:
        - name: cache-service
          image: acrcinedvps2026.azurecr.io/cine-cache-service:v1
          ports:
            - containerPort: 4000
          env:
            - name: REDIS_URL
              value: "redis://redis-cache:6379"
            # Credenciales OTLP del Grafana compartido no van en Git.
            # Inyectar en el clúster: OTEL_EXPORTER_OTLP_ENDPOINT y OTEL_EXPORTER_OTLP_HEADERS.
            - name: OTEL_SERVICE_NAME
              value: cache-service

---
apiVersion: v1
kind: Service
metadata:
  name: cache-service
spec:
  selector:
    app: cache-service
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
