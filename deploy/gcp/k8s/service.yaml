apiVersion: v1
kind: Service
metadata:
  name: cine-api
  namespace: cine-caos
  labels:
    app: cine-api
  annotations:
    # Demo académica temporal: IP externa para Sports (AWS) → Cine (GCP)
    # Tras la demo: eliminar el Service o cambiar a ClusterIP para cortar el LB
    cloud.google.com/neg: '{"ingress":false}'
spec:
  type: LoadBalancer
  selector:
    app: cine-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
