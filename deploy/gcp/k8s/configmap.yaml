apiVersion: v1
kind: ConfigMap
metadata:
  name: cine-api-config
  namespace: cine-caos
  labels:
    app: cine-api
data:
  APP_VERSION: "5.0.1-caos"
  APP_TRACK: "caos"
  PORT: "3000"
  DB_NAME: "cine_dvps"
  DB_PORT: "3306"
  # Cloud SQL Auth Proxy sidecar escucha en loopback del Pod
  DB_HOST: "127.0.0.1"
  DB_AUTO_INIT: "false"
  OTEL_SERVICE_NAME: "cine-api"
  OTEL_LOGS_EXPORTER: "none"
  # OTEL_EXPORTER_OTLP_ENDPOINT: pendiente endpoint Samuel
  RESILIENCE_ENABLED: "false"
  EXPERIMENT_ROUND: "baseline"
  BULKHEAD_MAX_CONCURRENT: "8"
  ADMISSION_MAX_INFLIGHT: "8"
  BULKHEAD_ENTER_TIMEOUT_MS: "2000"
  CACHE_URL: ""
  CLOUDSQL_CONNECTION_NAME: "cine-devops-canary:us-central1:cine-mysql-v4"
