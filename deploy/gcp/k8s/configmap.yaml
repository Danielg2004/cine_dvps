apiVersion: v1
kind: ConfigMap
metadata:
  name: cine-api-config
  namespace: cine-caos
  labels:
    app: cine-api
data:
  APP_VERSION: "5.0.1-caos-r1guard-f46e5f4"
  APP_TRACK: "caos"
  PORT: "3000"
  DB_NAME: "cine_dvps"
  DB_PORT: "3306"
  # Cloud SQL Auth Proxy sidecar escucha en loopback del Pod
  DB_HOST: "127.0.0.1"
  DB_AUTO_INIT: "false"
  OTEL_SERVICE_NAME: "cine-api"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  # Collector compartido Samuel (OCI). Auth Basic + CA van por Secret/ConfigMap montado.
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://157.137.233.183:31443"
  OTEL_EXPORTER_OTLP_CERTIFICATE: "/etc/otel/certs/otel-lab-ca.crt"
  RESILIENCE_ENABLED: "false"
  EXPERIMENT_ROUND: "baseline"
  BULKHEAD_MAX_CONCURRENT: "8"
  ADMISSION_MAX_INFLIGHT: "8"
  BULKHEAD_ENTER_TIMEOUT_MS: "200"
  CACHE_URL: ""
  CLOUDSQL_CONNECTION_NAME: "cine-devops-canary:us-central1:cine-mysql-v4"
